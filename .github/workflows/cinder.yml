name: Cinder
run-name: cinder-${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      ssh_public_key:
        description: Per-cinder Ed25519 public key generated by the CLI
        required: true
        type: string

permissions:
  contents: read

jobs:
  cinder:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate request
        env:
          CINDER_PUBLIC_KEY: ${{ inputs.ssh_public_key }}
        run: python3 scripts/runner.py validate
      - name: Join private network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cinder
          hostname: cinder-${{ github.run_id }}
      - name: Start SSH cinder
        env:
          CINDER_PUBLIC_KEY: ${{ inputs.ssh_public_key }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server rsync
          sudo --preserve-env=CINDER_PUBLIC_KEY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_WORKSPACE,RUNNER_TEMP python3 scripts/runner.py start
      - name: Publish connection details
        uses: actions/upload-artifact@v4
        with:
          name: cinder-${{ github.run_id }}
          path: ${{ runner.temp }}/cinder-connection/connection.json
          retention-days: 1
          if-no-files-found: error
      - name: Hold cinder until expiry
        run: python3 scripts/runner.py hold
      - name: Close SSH sessions
        if: always()
        run: sudo systemctl stop cinder-sshd.service || true
