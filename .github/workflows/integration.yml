name: Integration

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  escape-room:
    name: Warm a live cinder and let an LLM look around
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the required secrets
        id: secrets
        env:
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$TS_ID" ] && [ -n "$ANTHROPIC" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TS_OAUTH_CLIENT_ID or ANTHROPIC_API_KEY not set; skipping the live check."
          fi

      - name: Set up Python 3.12
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the CLI and rsync
        if: steps.secrets.outputs.ready == 'true'
        run: |
          python -m pip install -e .
          sudo apt-get update -qq && sudo apt-get install -y rsync

      - name: Join the tailnet
        if: steps.secrets.outputs.ready == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cinder
          hostname: integration-${{ github.run_id }}

      - name: Warm up a fresh cinder
        if: steps.secrets.outputs.ready == 'true'
        id: warmup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "id=$(./cinder warmup --repo ${{ github.repository }} --ref ${{ github.ref_name }})" >> "$GITHUB_OUTPUT"

      - name: Let the box wake up
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CINDER_ID: ${{ steps.warmup.outputs.id }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tests/box_escape.py

      - name: Extinguish the cinder
        if: always() && steps.warmup.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cinder stop "${{ steps.warmup.outputs.id }}" || true
