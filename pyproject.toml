[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinders"
version = "0.1.0"
readme = "README.md"
description = "Run commands over SSH on an ephemeral GitHub Actions runner reachable through Tailscale"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cinder = "cinders.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
